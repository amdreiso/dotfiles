
[general]
live_config_reload = true

[window]
title = "terminal :3"
opacity = 1.90

[font]
size = 8
#normal.family = "SpaceMonoNerdFont"
normal.family = "Terminus"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black = "#181818"
white = "#eeeeee"
red = "#ff5555"
yellow = "#ffff55"
green = "#55ff55"
blue = "#5555ff"
cyan = "#55ffff"
magenta = "#ff55ff"

[mouse]
hide_when_typing = true

