
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on

set -g status-left-style fg=red
set -g status-right-style fg=red

set -g window-status-current-style fg=red,bold
set -g window-status-style fg=brightblack

set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=red

set -g message-style bg=black,fg=white

set -g status-right "#[bg=#ffffff,fg=black] #H "

set -g status-style bg=default,fg=#4682b4

unbind C-b
set -g prefix C-k
bind C-k send-prefix

set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

set -g status-fg red

